<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1C1E22">
<title>Relay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --navy:#1C1E22; --panel:#171A24; --bone:#EEE8DC; --grey:#9796AC; --amber:#F2B33D; --ink:#15171C; --red:#E5483B;
  --display:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  --pad:24px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--navy);color:var(--bone);font-family:var(--body);font-size:16px;line-height:24px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:background .2s,color .2s}
body.listening{background:var(--navy);color:var(--bone)}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex:none}
.top .word{flex:1 1 auto}
.word{all:unset;display:block;min-width:0;max-width:100%;cursor:pointer;font-family:var(--display);font-weight:600;font-size:80px;line-height:76px;letter-spacing:-.015em;white-space:pre-line;text-wrap:balance}
/* instruction type: the biggest step on the scale that fits in 4 lines and 216px tall (72 > 64 > 56 > 48 > 40 > 36 > 32). Set in fitInstr(). */
.word.instr{letter-spacing:-.01em;white-space:normal;overflow-wrap:normal}
.word:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
.word.greet{white-space:pre-line;letter-spacing:-.015em}
.close{all:unset;flex:none;width:48px;height:48px;margin:-8px -12px 0 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--grey)}
.close svg{width:28px;height:28px}
body.listening .close{color:var(--grey)}
.close[hidden],.word[hidden]{display:none}
.ctxline{margin:16px 0 0;font-size:16px;line-height:24px;color:var(--grey);text-wrap:pretty}
.ctxline:empty{display:none}
.stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;margin-top:24px}
/* map: edge to edge, runs down to the soundwave */
.mapwrap{position:relative;flex:1 1 auto;min-height:240px;margin:0 calc(var(--pad) * -1);background:var(--panel)}
.map{position:absolute;inset:0;background:var(--panel);touch-action:none}
.mapctl{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapctl button{all:unset;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(28,30,34,.72);color:var(--bone);cursor:pointer}
.mapctl svg{width:20px;height:20px}
.mapctl button:focus-visible{outline:2px solid var(--amber)}
.mapnote{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(28,30,34,.88);padding:4px 8px;border-radius:8px;font-size:14px;line-height:20px;color:var(--bone)}
.leaflet-container{background:var(--panel);font-family:var(--body)}
.leaflet-control-attribution{background:rgba(23,26,36,.72)!important;color:var(--grey)!important;font-size:11px;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--bone)!important}
/* bottom of the screen: a yellow mic to talk (big on home, small on answers). The yellow soundwave appears only on the listening screen. */
.dock{flex:none;height:calc(112px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center}
body.session .dock{height:calc(88px + env(safe-area-inset-bottom,0px))}
.mic{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:88px;height:88px;color:var(--amber)}
.mic svg{width:56px;height:56px}
body.session .mic{width:64px;height:64px}
body.session .mic svg{width:36px;height:36px}
body.follow .mic svg,body.listening .mic svg{animation:hear 1.2s ease-in-out infinite}  /* listening: the same mic, gently pulsing; no waveform */
@keyframes hear{0%,100%{opacity:1}50%{opacity:.35}}
.mic:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:999px}
.wave{display:none;align-items:center;justify-content:center;gap:9px;height:88px;color:var(--amber)}
.wave i{display:block;height:100%;border-radius:999px;background:currentColor;transform-origin:50% 50%}
.wave i:nth-child(1),.wave i:nth-child(5){height:42%}
.wave i:nth-child(2),.wave i:nth-child(4){height:70%}
.wave i{width:18px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(1){animation-delay:-.45s}.wave i:nth-child(2){animation-delay:-.15s}.wave i:nth-child(3){animation-delay:-.3s}.wave i:nth-child(4){animation-delay:-.6s}.wave i:nth-child(5){animation-delay:-.75s}
@keyframes wv{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* start: the icon's three lines carry on from Android's splash, travel down and out of the screen, then the greeting fades in. Once per launch. */
#intro{position:fixed;inset:0;z-index:50;pointer-events:none;background:#1C1E22;transition:background-color .2s linear}
#intro.clear{background-color:transparent}
#intro path{fill:none;stroke:#F2B33D;animation:introgo .48s cubic-bezier(.45,0,.9,.6) forwards}
@keyframes introgo{to{stroke-dashoffset:var(--to)}}
body.intro .app{opacity:0}
.app{transition:opacity .2s ease-out}
/* voice list: every English voice the phone reports, tap one to hear it and use it */
.vlist{position:fixed;inset:0;z-index:60;background:var(--navy);color:var(--bone);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 0}
.vlist[hidden]{display:none}
.vlist h2{margin:0;font:600 40px/44px var(--body);letter-spacing:-.01em}
.vlist .vnote{margin:12px 0 16px;color:var(--grey);font-size:16px;line-height:24px}
.vlist ul{list-style:none;margin:0 -24px;padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;flex:1 1 auto}
.vlist li button{all:unset;box-sizing:border-box;width:100%;display:block;padding:14px 16px;margin:0 0 8px;border-radius:16px;background:#26282D;cursor:pointer}
.vlist li button.on{background:var(--amber);color:var(--ink)}
.vlist li .n{display:block;font-size:18px;line-height:24px;font-weight:600}
.vlist li .m{display:block;font-size:14px;line-height:20px;opacity:.75}
.vlist .vclose{position:absolute;right:12px;top:calc(16px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){body{transition:none} .wave i,.mic svg{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="word" id="word" type="button" aria-live="polite"></button>
    <button class="close" id="close" type="button" aria-label="Close and start again" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="ctxline" id="ctx"></p>
  <div class="stage" id="stage"></div>
  <div class="dock"><button class="mic" id="mic" type="button" aria-label="Talk to Relay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3.5M8.5 21h7"/></svg></button></div>
  <div class="sr" id="vstate" aria-live="polite"></div>
</div>

<div class="vlist" id="vlist" hidden role="dialog" aria-label="Voices">
  <button class="close vclose" id="vclose" type="button" aria-label="Close voices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h2>Voices</h2>
  <p class="vnote" id="vnote">Tap a voice to hear it. The one you tap last is the one Relay uses.</p>
  <ul id="vitems"></ul>
</div>
<script src="leaflet.js"></script>
<script src="data-bluegate.js"></script>
<script>
const $ = id => document.getElementById(id);
/* =================== data =================== */
const MAP = window.BLUE_GATE;
const R = MAP.rows.map(([k, c, n, y, x]) => ({ k, c, n, y, x }));
const pt = (n, y, x) => ({ n, y, x });
const byName = s => R.find(r => r.n.toLowerCase().includes(s.toLowerCase()));
const fromRow = (r, label) => r ? pt(label || r.n, r.y, r.x) : null;

const EXITS = R.filter(r => r.c === "extraction").map(r => pt(r.n, r.y, r.x));
const HATCHES = R.filter(r => r.c === "hatch").map(r => pt(r.n, r.y, r.x));
const ENEMIES = {};
R.filter(r => r.k === "a").forEach(r => { (ENEMIES[r.c] = ENEMIES[r.c] || []).push(pt(r.c, r.y, r.x)); });

/* places you can say you're at (names from MetaForge markers) */
const P = (n, y, x, al) => ({ n, y, x, al });
const PLACES = [
  ...EXITS.map(e => P(e.n, e.y, e.x, [e.n.split(" ")[0].toLowerCase()])),
  ...HATCHES.map(e => P(e.n, e.y, e.x, [e.n.toLowerCase(), e.n.split(" ")[0].toLowerCase() + " hatch"])),
  P("Blue Gate Village", 3180, 5753, ["village"]),
  P("Pilgrim's Peak", 3245, 9568, ["pilgrim", "peak tower"]),
  P("the Communication Tower", 3374, 9539, ["communication tower", "comms tower", "comm tower", "radio tower"]),
  P("the Cellar", 6684, 6461, ["cellar"]),
  P("the Security Wing", 3922, 7049, ["security wing"]),
  P("the Control Room", 4206, 7380, ["control room"]),
  P("the Confiscation Room", 4017, 7387, ["confiscation room"]),
  P("the Checkpoint", 5800, 5918, ["checkpoint"]),
  P("the Traffic Tunnel", 4367, 7335, ["traffic tunnel", "the tunnel"]),
  P("the Olive Grove", 6329, 6683, ["olive grove", "olives"]),
  P("the Collapsed Highway", 5430, 4553, ["collapsed highway", "highway"]),
  P("the Barren Clearing", 3695, 4528, ["barren clearing", "clearing"]),
  P("the Maintenance Bunker", 5818, 7518, ["maintenance bunker", "bunker"]),
  P("the Enelica Building", 5721, 7795, ["enelica"]),
  P("the Abandoned Housing Project", 4879, 9485, ["housing project", "abandoned housing"]),
  P("the Raider Camp", 5252, 8836, ["raider camp"]),
  P("the Ancient Fort", 7025, 7501, ["ancient fort", "fort"])
];

/* quests: steps follow the in-game order; pins from MetaForge quest markers */
const HTR = n => fromRow(byName("Part " + n + " -"), "Step " + n);
const QUESTS = [
  { n: "Home to Roost", al: ["home to roost", "roost"], who: "Shani",
    note: "Steps placed by MetaForge. Route in our own words from Destructoid and All Things How. It's underground, so the dot marks the spot above you.",
    steps: [
      { t: "Reach the back of the Blue Gate tunnels", where: "the back of the tunnels", go: "Head into the traffic tunnels and keep left, past the burnt-out vehicles, to the back wall.", show: "Tunnels. Keep left to the back wall.", pin: HTR(1), al: ["back of the tunnel", "tunnel entrance", "the tunnels"] },
      { t: "Scan an Android at the back of the Traffic Tunnels", where: "the Android at the back of the tunnels", go: "At the back wall, the Android stands behind a booth. Get close to scan it.", show: "Android behind the booth. Scan it.", pin: HTR(2), al: ["android", "scan"] },
      { t: "Head to the MANTIKOR locker room", where: "the locker room", go: "From the Android, take the route on your right to a short staircase and a door into the Security Wing. Go up the second short flight. The locker room door is immediately on your right. You may need to breach it.", show: "Right, up two flights. Door on your right.", pin: HTR(3), al: ["mantikor", "locker room"] },
      { t: "Search the locker room for clues", where: "the locker room", go: "Interact with the mural on the back wall of the locker room.", show: "Mural on the back wall.", pin: HTR(4), al: ["clue", "mural"] },
      { t: "Read the final vehicle weighing logs", where: "the weighing station", go: "Go back down the stairs to the platform over the underground garage. The weighing station is among the parked vehicles, panel on its right side.", show: "Down to the garage. Weighing station panel.", pin: HTR(5), al: ["weighing", "logs", "weigh"] },
      { t: "Optional: find the hidden key", where: "the weighing station", go: "Behind the concrete barrier next to the weighing terminal. It opens the Confiscation Room, so grab it if you haven't got one.", show: "Behind the barrier by the terminal.", pin: HTR(6), al: ["hidden key", "the key", "spare key"] },
      { t: "Enter the Confiscation Room", where: "the Confiscation Room", go: "Back up on the Security Wing platform, with the stairs on your right. The door is locked and needs the Confiscation Room key.", show: "Back up to Security Wing. Use the key.", pin: HTR(7), al: ["confiscation"] },
      { t: "Send MANTIKOR's last security recordings to Shani", where: "the Confiscation Room", go: "Inside the Confiscation Room, the white box is on top of the central server rack. Climb the rack or the crates beside it.", show: "White box on the server rack. Climb up.", pin: HTR(8), al: ["recording", "white box", "server rack"] }
    ] },
  { n: "Nothing Ventured", al: ["nothing ventured"], who: "Apollo", note: "Spawn points: MetaForge.",
    steps: [
      { t: "Destroy 3 Comets", enemy: "comet" }, { t: "Destroy 5 Rocketeers", enemy: "rocketeer" }, { t: "Destroy 2 Sentinels", enemy: "sentinel" },
      { t: "Deliver 3 Comet Igniters to Apollo", go: "Comet Igniters drop from Comets." }, { t: "Deliver 3 Rocketeer Drivers to Apollo", go: "Rocketeer Drivers drop from Rocketeers." },
      { t: "Deliver 6 ARC Circuitry to Apollo" }, { t: "Deliver 6 ARC Motion Cores to Apollo" }
    ] },
  { n: "Wires Crossed", al: ["wires crossed", "snitch scanner"], who: "Celeste", note: "Position: MetaForge.",
    steps: [
      { t: "On Blue Gate, attach a Snitch Scanner to the antenna at Pilgrim's Peak", go: "The antenna is on Pilgrim's Peak, in the north-east.", pin: fromRow(byName("attach a Snitch Scanner"), "Antenna") },
      { t: "On Spaceport, attach a Surveyor Vault to the antenna on the Launch Towers", go: "Relay only has Blue Gate's map so far." },
      { t: "On Buried City, attach a Sentinel Firing Core to the antenna on the Grandioso Apartments roof", go: "Relay only has Blue Gate's map so far." }
    ] },
  { n: "The First Nomads", al: ["first nomads", "nomads"], who: "", note: "Positions: MetaForge.",
    steps: [
      { t: "Reach the Security Wing", pin: fromRow(byName("1. Reach the Security Wing"), "Security Wing") },
      { t: "Find the Control Room in the Security Wing", pin: fromRow(byName("2. Find the Control Room"), "Control Room") },
      { t: "Use the frequency converter in the Control Room", pin: fromRow(byName("3. Use the frequency converter"), "Frequency converter") },
      { t: "Reach the antenna at Pilgrim's Peak", pin: fromRow(byName("4. Reach the Antenna"), "Antenna") },
      { t: "Search the antenna exterior for tampered frequency boosters", pin: fromRow(byName("5. Search the Antenna"), "Antenna exterior") }
    ] },
  { n: "A Path Not Yours", al: ["path not yours", "bilguun"], who: "", note: "Positions: MetaForge.",
    steps: [
      { t: "Find the start of the Nomad trail under the Highway Collapse", pin: fromRow(byName("1. Find the start of the Nomad trail"), "Trail start") },
      { t: "Follow the trail markers to the Nomad hideout", pin: fromRow(byName("2. Follow the trail markers"), "Hideout") },
      { t: "Find Bilguun's gift at the buried cache under the hideout", pin: fromRow(byName("3. Find Bilguun's gift"), "Buried cache") },
      { t: "Loot the secret stash in Bilguun's hideout", pin: fromRow(byName("4. Loot the secret stash"), "Secret stash") }
    ] },
  { n: "A First Foothold", al: ["first foothold", "foothold"], who: "", note: "Positions: MetaForge.",
    steps: [
      { t: "Rotate the satellite dishes", pin: fromRow(byName("Rotate Satellite Dishes"), "Satellite dishes"), al: ["satellite", "dishes"] },
      { t: "Stabilise the observation deck", pin: fromRow(byName("Stabilize Observation Deck"), "Observation deck"), al: ["observation deck"] },
      { t: "Enable the comms terminal", pin: fromRow(byName("Enable Comms Terminal"), "Comms terminal"), al: ["comms terminal"] },
      { t: "Nail down the roof plates", pin: fromRow(byName("Nail Down Roof Plates"), "Roof plates"), al: ["roof plates"] }
    ] },
  { n: "Reduced to Rubble", al: ["reduced to rubble", "rubble"], who: "", note: "Positions: MetaForge.",
    steps: [
      { t: "Take a photo of the Collapsed Highway", pin: fromRow(byName("Take a photo of the Collapsed"), "Photo spot"), al: ["photo"] },
      { t: "Go to the Broken Earth", pin: fromRow(byName("Go to the Broken Earth"), "Broken Earth"), al: ["broken earth"] },
      { t: "Follow the trail of destruction", pin: fromRow(byName("Follow the trail of destruction"), "Trail"), al: ["trail"] },
      { t: "Investigate the unknown ARC machines", pin: fromRow(byName("Investigate the Unknown Arc"), "ARC machines"), al: ["unknown arc", "machines"] }
    ] },
  { n: "Bait, Fetch, Blast", al: ["bait", "fetch", "blast", "bully"], who: "Apollo",
    steps: [ { t: "Destroy a Bully, its head, or 4 of its legs", go: "This one's on Pendola Pass. Relay only has Blue Gate's map so far." }, { t: "Deliver a Bully Fragmenter to Apollo", go: "The Fragmenter comes from the Bully." } ] },
  { n: "Taking Stock", al: ["taking stock"], who: "Cassio",
    steps: [ { t: "On Stella Montis, photograph the sculpture in the Atrium" }, { t: "On Spaceport, photograph a Baron Husk" }, { t: "Deliver 3 Industrial Batteries to the Nomadic Envoy" }, { t: "Ping a Bombardier on Dam, or a Bastion on Buried City" } ] },
  { n: "Boarding the Frigate", al: ["boarding the frigate", "frigate"], who: "Shani",
    steps: [ { t: "Find a way onto the Frigate's top" }, { t: "Damage a Hydra, a Vaporizer and a Rocketeer" } ] },
  { n: "Belly of the Beast", al: ["belly", "emperor"], who: "Shani",
    steps: [ { t: "Enter the Emperor" }, { t: "Find the source of the Emperor's power" }, { t: "Find out what happens to Harvester Payloads inside" }, { t: "Find where the Payloads are stored" }, { t: "Search 5 containers inside the Emperor" }, { t: "Take a unique piece of Emperor loot" } ] }
];
const OTHER_MAPS = ["dam", "spaceport", "buried city", "stella montis", "pendola", "riven tides"];
const ENEMY_WORDS = Object.keys(ENEMIES);

/* =================== state =================== */
const EMPTY = { place: null, placeAt: null, minutesLeft: null, minutesAt: null, quest: null, step: 0, last: null, raidAt: null, pending: null, seen: null };
let S = Object.assign({}, EMPTY);
try { const saved = JSON.parse(localStorage.getItem("spottr-state") || "null"); if (saved) S = Object.assign(S, saved); } catch (e) {}
function save() { try { localStorage.setItem("spottr-state", JSON.stringify(S)); } catch (e) {} }
const inRaid = () => S.raidAt && Date.now() - S.raidAt < 40 * 60 * 1000;
function minsNow() { if (S.minutesLeft == null) return null; return Math.max(0, Math.round(S.minutesLeft - (Date.now() - S.minutesAt) / 60000)); }

/* =================== geometry (y grows south, as MetaForge draws it) =================== */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function compass(from, to) {
  const a = (Math.atan2(to.x - from.x, -(to.y - from.y)) * 180 / Math.PI + 360) % 360;
  return ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"][Math.round(a / 45) % 8];
}
const near = (p, list) => list.slice().sort((a, b) => dist(p, a) - dist(p, b))[0];

/* =================== understanding =================== */
const has = (t, words) => words.some(w => t.includes(w));
const norm = raw => " " + raw.toLowerCase().replace(/\b(hey|hi|ok|okay)?\s*(relay|really|re lay|spotter|spottr)\b[,]?/g, " ").replace(/[’]/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ") + " ";
function findPlace(t) { return PLACES.find(p => p.al.some(a => t.includes(a))); }
/* quest names, forgiving of mishearing: exact words first, then near matches ("home to boost" = Home to Roost).
   A name of several words may be 2 letters off in total; a single long word 1; short single words must be exact. */
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur.push(Math.min(prev.at(j) + 1, cur.at(j - 1) + 1, prev.at(j - 1) + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1))); prev = cur; }
  return prev.at(n);
}
function fuzzyHas(t, alias) {
  const aw = alias.split(" "), tw = t.trim().split(" "), n = aw.length;
  const allowed = n >= 2 ? Math.max(2, Math.round(alias.length * 0.2)) : alias.length >= 6 ? 1 : 0;  /* about 1 letter in 5 */
  if (!allowed) return false;
  for (let i = 0; i + n <= tw.length; i++) {
    let d = 0;
    for (let k = 0; k < n && d <= allowed; k++) { const w = tw.at(i + k), x = aw.at(k); d += (x.length <= 3 && w !== x) ? 9 : lev(w, x); }  /* little words ("to", "a") must match exactly */
    if (d <= allowed) return true;
  }
  return false;
}
function findQuest(t) { return QUESTS.find(q => q.al.some(a => t.includes(a))) || QUESTS.find(q => q.al.some(a => fuzzyHas(t, a))); }
const placeAge = () => S.placeAt ? (Date.now() - S.placeAt) / 60000 : Infinity;
function posState() { if (!S.place) return "none"; const a = placeAge(); return a < 2 ? "fresh" : a <= 10 ? "stale" : "none"; }
/* raid memory: where you probably are, when you haven't said. Confirmed beats guessed; a guess is always said out loud as a guess.
   Sources, best first: a place you named in the last 2 minutes (confirmed), one from the last 10 minutes (guess),
   the spot of the quest step you last finished in the last 30 minutes (guess). Never invents anything off the map data. */
function likelyPos() {
  const ps = posState();
  if (ps === "fresh") return { p: S.place, sure: true };

  if (CAP && CAP.SpeechRecognition) {
    try {
      const p = await CAP.SpeechRecognition.requestPermissions();
      if (p && p.speechRecognition && p.speechRecognition !== "granted") { nothingHeard(startedAt, "permission"); return; }
      listening = true; startListeningUI(auto);
      const r = await CAP.SpeechRecognition.start({ language: "en-GB", maxResults: 1, partialResults: false, popup: false });
      const text = r && r.matches && r.matches[0];
      if (text) heard(text); else nothingHeard(startedAt);
    } catch (e) { const m = String(e && (e.message || e)); nothingHeard(startedAt, /network/i.test(m) ? "network" : /permission/i.test(m) ? "permission" : ""); }
    return;
  }
  if (!WebRec) { showError("Voice isn't available here. Open Relay on your phone."); return; }
  webRec = new WebRec(); webRec.lang = "en-GB"; webRec.interimResults = false; webRec.maxAlternatives = 1;
  let finalText = "", err = "";
  listening = true; startListeningUI(auto);
  webRec.onresult = e => { for (const r of e.results) if (r.isFinal) finalText = r[0].transcript; };
  webRec.onerror = e => { err = e.error === "not-allowed" || e.error === "service-not-allowed" ? "permission" : e.error === "network" ? "network" : ""; };
  webRec.onend = () => { if (!listening) return; if (finalText) heard(finalText); else nothingHeard(startedAt, err); };
  try { webRec.start(); } catch (e) { nothingHeard(startedAt, "fatal"); }
}
function startListeningUI(auto) { followMode = auto; if (auto) { setVoiceState("listening"); document.body.classList.add("follow"); } else renderListening(); }
function stopListening() { convoUntil = 0; try { if (CAP && CAP.SpeechRecognition) CAP.SpeechRecognition.stop(); else if (webRec) webRec.stop(); } catch (e) {} }

/* =================== system bars match the screen (native only) =================== */
function bars(listeningNow) { try { if (CAP && CAP.SystemBars) CAP.SystemBars.set({ color: "#1C1E22", light: false }); } catch (e) {} }

/* =================== rendering =================== */
function setWord(txt, instr) {
  const w = $("word");
  w.hidden = false; w.classList.remove("greet"); w.textContent = txt; w.style.fontSize = ""; w.style.lineHeight = "";
  w.classList.toggle("instr", !!instr);
  if (instr) { fitInstr(w); requestAnimationFrame(() => fitInstr(w)); return; }
  requestAnimationFrame(() => {
    const avail = w.parentElement.clientWidth - ($("close").hidden ? 0 : 52);
    w.style.whiteSpace = "pre"; const need = w.scrollWidth; w.style.whiteSpace = "";
    if (need > avail && avail > 0) { const size = Math.max(36, Math.floor(80 * avail / need)); w.style.fontSize = size + "px"; w.style.lineHeight = Math.round(size * .95) + "px"; }
  });
}
/* type rule: short instructions are huge, longer ones step down. Aim for 40 characters, never over 60. */
const TYPE_SCALE = [80, 72, 64, 56, 48, 44, 40, 36];
function fitInstr(w) {
  w.style.overflowWrap = "normal";
  for (const s of TYPE_SCALE) {
    const lh = Math.round(s * 1.02);
    w.style.fontSize = s + "px"; w.style.lineHeight = lh + "px";
    if (Math.floor(w.scrollHeight / lh) <= 4 && w.scrollHeight <= 216 && w.scrollWidth <= w.clientWidth + 1) return s;

  return 32;
}
window.addEventListener("resize", () => { const w = $("word"); if (w.classList.contains("greet")) fitGreet(w); else if (w.textContent) setWord(w.textContent, w.classList.contains("instr")); if (lmap) lmap.invalidateSize(); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lmap = null;
function clearMap() { if (lmap) { lmap.remove(); lmap = null; } }
/* greeting: time of day, then one of six lines. A new line each launch (never the same twice running); it doesn't change while you're using the app. */
const LINES = ["Let's get you home in one piece.", "Need a hand topside?", "Try not to get lost out there.", "What's the plan?", "Got yourself into trouble again?", "Let's make this a quick one."];
const LINE = (() => { let last = -1; try { last = parseInt(localStorage.getItem("spottr-line") || "-1", 10); } catch (e) {} let i = Math.floor(Math.random() * (LINES.length - 1)); if (i >= last && last >= 0) i++; try { localStorage.setItem("spottr-line", String(i)); } catch (e) {} return LINES[i]; })();
function fitGreet(w) {
  const room = Math.max(240, $("stage").getBoundingClientRect().bottom - w.getBoundingClientRect().top - 24);
  for (const s of [72, 64, 56, 52, 48, 44, 40]) { const lh = Math.round(s * 1.0); w.style.fontSize = s + "px"; w.style.lineHeight = lh + "px"; if (w.scrollWidth <= w.clientWidth + 1 && w.scrollHeight <= room && w.scrollHeight <= lh * 6 + 2) return; }
}
function setSub() {}
function setCtx(t) { $("ctx").textContent = t || ""; }

function renderReady() {
  clearMap(); bars(false);
  document.body.classList.remove("listening", "session", "follow"); $("close").hidden = true;
  const hr = new Date().getHours();
  const part = hr >= 5 && hr < 12 ? "Morning" : hr >= 12 && hr < 18 ? "Afternoon" : "Evening";
  const w = $("word"); w.hidden = false; w.classList.remove("instr"); w.classList.add("greet"); w.textContent = part + ", Raider.\n" + LINE;
  setCtx(""); $("stage").innerHTML = "";
  fitGreet(w); requestAnimationFrame(() => fitGreet(w));
  $("stage").innerHTML = "";
}
function renderListening() {
  clearMap(); setVoiceState("listening"); bars(true);
  document.body.classList.remove("follow"); document.body.classList.add("listening");
  setWord("Go\nahead."); setSub(""); setCtx("");
  $("stage").innerHTML = "";
}
function renderBack() { setVoiceState("idle"); document.body.classList.remove("listening"); if (S.last) renderAnswer(S.last.q, S.last.a); else renderReady(); }
function showError(msg) { setVoiceState("idle"); bars(false); document.body.classList.remove("listening", "follow"); document.body.classList.add("session"); $("close").hidden = false; clearMap(); setWord(msg, true); setSub(""); setCtx(""); $("stage").innerHTML = ""; }

const IC = {
  centre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  whole: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};
function renderAnswer(q, a) {
  clearMap(); bars(false);
  document.body.classList.remove("listening"); document.body.classList.add("session"); $("close").hidden = false;
  setWord(a.show || a.text || "", true); setSub(""); setCtx(a.ctx || "");
  const hasMap = a.map && (a.map.stars.length || a.map.you);
  $("stage").innerHTML = hasMap ? '<div class="mapwrap"><div class="map" id="map" role="img" aria-label="' + esc(mapLabel(a.map)) + '"></div><div class="mapctl"><button type="button" id="recentre" aria-label="Recentre">' + IC.centre + '</button><button type="button" id="full" aria-label="Whole map">' + IC.whole + '</button></div><div class="mapnote" id="mapnote" hidden></div></div>' : "";
  if (hasMap) requestAnimationFrame(() => drawMap(a.map));
}
function mapLabel(m) { const p = []; if (m.you) p.push((m.you.guess ? "probably near " : "you at ") + m.you.n); if (m.stars.length) p.push("marked: " + m.stars.map(s => s.n).join(", ")); return "Blue Gate map, " + p.join("; "); }

/* markers: a yellow dot for the place, a white dot for you, a dashed ring when your position is a guess */
const DOT = s => '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:#F2B33D;box-shadow:0 0 0 3px #1C1E22,0 0 0 5px rgba(242,179,61,.35)"></div>';
const YOU = '<div style="width:20px;height:20px;border-radius:50%;background:#F2F0EA;box-shadow:0 0 0 3px #1C1E22"></div>';
const YOU_GUESS = '<div style="width:44px;height:44px;border-radius:50%;border:2px dashed #F2F0EA;display:flex;align-items:center;justify-content:center"><div style="width:10px;height:10px;border-radius:50%;background:#F2F0EA"></div></div>';
function drawMap(m) {
  if (!$("map")) return;
  if (!window.L) { $("mapnote").hidden = false; $("mapnote").textContent = "Map couldn't load."; return; }
  const [a, b, c, d] = MAP.transform;
  const crs = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(a, b, c, d) });
  lmap = L.map("map", { crs, zoomControl: false, attributionControl: true, minZoom: 0, maxZoom: 7, zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, bounceAtZoomLimits: false, inertia: true, maxBounds: [[1500, 3000], [9000, 11500]], maxBoundsViscosity: 0.8 });
  lmap.attributionControl.setPrefix(false);
  let fails = 0;
  const tl = L.tileLayer(MAP.tiles, { tileSize: 512, maxNativeZoom: 5, noWrap: true, keepBuffer: 4, bounds: [[37.2, 78.5], [16218, 16271]], attribution: 'Map: <a href="https://metaforge.app/arc-raiders" target="_blank" rel="noopener">MetaForge</a>' }).addTo(lmap);
  tl.on("tileerror", () => { fails++; if (fails === 3) { $("mapnote").hidden = false; $("mapnote").textContent = "Map needs a connection. The answer above still stands."; } });
  const ll = p => [p.y, p.x];
  const single = m.stars.length === 1;
  if (m.you && single) L.polyline([ll(m.you), ll(m.stars[0])], { color: "#F2F0EA", weight: 2, opacity: .7, dashArray: "4 8", lineCap: "round" }).addTo(lmap);
  m.stars.forEach(p => { const s = single ? 22 : 14; L.marker(ll(p), { icon: L.divIcon({ className: "", html: DOT(s), iconSize: [s, s], iconAnchor: [s / 2, s / 2] }), keyboard: false, interactive: false }).addTo(lmap); });
  if (m.you) { const g = !!m.you.guess, s = g ? 44 : 20; L.marker(ll(m.you), { icon: L.divIcon({ className: "", html: g ? YOU_GUESS : YOU, iconSize: [s, s], iconAnchor: [s / 2, s / 2] }), keyboard: false, interactive: false }).addTo(lmap); }
  const pts = [...m.stars, ...(m.you ? [m.you] : [])].map(ll);
  const frame = () => { if (pts.length === 1) lmap.setView(pts[0], 4); else lmap.fitBounds(L.latLngBounds(pts), { padding: [56, 56], maxZoom: 4.5 }); };
  frame();
  $("recentre").onclick = frame;
  $("full").onclick = () => lmap.fitBounds(MAP.bounds, { padding: [16, 16] });
}

/* =================== flow =================== */
function handle(q) {
  q = (q || "").trim(); if (!q) return;
  let a = S.pending ? resolvePending(q) : null;
  if (!a) a = answer(q);
  const go = () => { if (a.after) a.after(); if (a.follow === false) { convoUntil = 0; endFollow(); return; } convoUntil = Date.now() + CONVO_MS; setTimeout(() => listen({ auto: true }), 350); };
  if (a.keepLast && S.last) { renderAnswer(S.last.q, S.last.a); speak(a.say, go); return; }
  S.last = { q, a }; save();
  renderAnswer(q, a);
  speak(a.say, go);
}
/* the mic is the button, and so is the screen (except the map). Tap while listening to stop. */
$("mic").addEventListener("click", e => { e.stopPropagation(); listen(); });
/* tapping the greeting opens the voice list: every English voice the phone reports, each playable, no microphone involved */
const TEST_LINE = "You need to get to the locker room. Take the stairs on your right, then the door is straight ahead.";
async function openVoices() {
  const box = $("vlist"), ul = $("vitems"); box.hidden = false; ul.innerHTML = "";
  let all = [];
  try { const r = RV ? await RV.voices() : null; all = (r && r.voices) || []; } catch (e) {}
  const fixed = [{ name: "@system", rate: 1.0, label: "Test A: settings voice, normal speed", meta: "Speed 1.0 instead of 0.95" },
                 { name: "@system", rate: 1.0, plain: true, label: "Test B: settings voice, normal speed, plain audio", meta: "Speed 1.0, no assistant audio type: closest to the settings Play button" },
                 { name: "@system", label: "Same as Android settings Play", meta: "Names only your phone's language and lets Google choose" },
                 { name: "@uk", label: "UK English, Google's choice", meta: "Names UK English and lets Google choose" },
                 { name: "", label: "Google default voice object", meta: "What Relay has been using" }];
  const rank = v => (/^en-GB/i.test(v.lang) ? 0 : /^en-US/i.test(v.lang) ? 1 : 2);
  all.sort((a, b) => rank(a) - rank(b) || (a.network - b.network) || (b.quality - a.quality) || a.name.localeCompare(b.name));
  const rows = fixed.concat(all.map(v => ({ name: v.name, label: v.name, meta: v.lang + " \u00b7 quality " + v.quality + " \u00b7 " + (v.network ? "online" : "offline") + (v.installed ? "" : " \u00b7 not downloaded") })));
  rows.forEach(v => {
    const li = document.createElement("li"), b = document.createElement("button"); b.type = "button";
    b.innerHTML = '<span class="n"></span><span class="m"></span>'; b.querySelector(".n").textContent = v.label; b.querySelector(".m").textContent = v.meta;
    if ((S.voice || "") === v.name && S.voicePicked) b.classList.add("on");
    b.addEventListener("click", () => {
      ul.querySelectorAll("button.on").forEach(x => x.classList.remove("on")); b.classList.add("on");
      S.voice = v.name; S.voicePicked = true; S.voiceV = 2; S.voiceRate = v.rate || null; S.voicePlain = !!v.plain; save();
      VOICES = [{ name: v.name, label: v.label }]; voiceIdx = 0;
      speak(TEST_LINE);
    });
    li.appendChild(b); ul.appendChild(li);
  });
  $("vnote").textContent = all.length + " English voices on this phone. Tap one to hear it; the last one you tap is the one Relay uses.";
}
$("vclose").addEventListener("click", () => { stopSpeaking(); $("vlist").hidden = true; loadVoices(); });
$("word").addEventListener("click", () => {
  if ($("word").classList.contains("greet")) { openVoices(); return; }
  listen();
});
document.querySelector(".app").addEventListener("click", e => { if (e.target.closest(".mapwrap,.close,.mic,.word")) return; listen(); });
$("close").addEventListener("click", e => { e.stopPropagation(); stopSpeaking(); stopListening(); endFollow(); const v = S.voice; S = Object.assign({}, EMPTY); S.voice = v; S.voiceV = 2; S.voicePicked = !!v; save(); renderReady(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { convoUntil = 0; stopListening(); stopSpeaking(); endFollow(); } });

loadVoices();
if (S.last) renderAnswer(S.last.q, S.last.a); else renderReady();
/* =================== start animation =================== */
(function intro() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const Wd = innerWidth, Ht = innerHeight, S = 160;             /* Android 12+ splash shows the icon's 72-unit window at 160dp, centred */
  const L0 = (Wd - S) / 2, T0 = (Ht - S) / 2, s = S / 72, HOLD = 250, DUR = 480, STEP = 80;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", Wd); svg.setAttribute("height", Ht); svg.setAttribute("aria-hidden", "true");
  const box = document.createElement("div"); box.id = "intro"; box.appendChild(svg); document.body.appendChild(box); document.body.classList.add("intro");
  [46, 30, 14].forEach((r0, j) => {                              /* outer line leaves first */
    const r = r0 * s, Y = T0 + 58 * s, X = L0 + 14 * s, y0 = Y - r;
    const h = X - L0, arc = Math.PI * r / 2, vis = h + arc + (T0 + S - Y), tot = h + arc + (Ht + 40 - Y);
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", "M " + L0 + " " + y0 + " H " + X + " A " + r + " " + r + " 0 0 1 " + (X + r) + " " + Y + " V " + (Ht + 40));
    p.setAttribute("stroke-width", 10 * s);
    p.style.strokeDasharray = vis.toFixed(1) + " 4000"; p.style.setProperty("--to", (-tot).toFixed(1));
    p.style.animationDelay = (HOLD + j * STEP) + "ms"; svg.appendChild(p);
  });
  const end = HOLD + DUR + STEP * 2;
  setTimeout(() => { document.body.classList.remove("intro"); box.classList.add("clear"); }, end - 160);
  setTimeout(() => box.remove(), end + 300);
})();
async function keepAwake() { try { if (CAP && CAP.KeepAwake) await CAP.KeepAwake.keepAwake(); else if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
keepAwake(); document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
if ("serviceWorker" in navigator && !CAP && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
