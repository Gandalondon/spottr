name: Build Spottr APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk spottr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spottr-apk
          path: spottr.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Spottr test build
          body: Latest test build of Spottr. Download spottr.apk on your phone and open it to install.
          files: spottr.apk
          make_latest: true
