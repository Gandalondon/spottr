name: Build Relay APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Fixed test signing key (when the secret is set)
        env:
          KEY_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > android/app/relay-test.keystore
            echo "Signing with the fixed test key"
          else
            echo "No fixed key yet, using a random debug key"
          fi
      - name: Offline voice library (sherpa-onnx)
        run: mkdir -p android/app/libs && curl -sSL --fail -o android/app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
      - run: |
          set -o pipefail
          chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELAY_KEY_PASS: ${{ secrets.RELAY_KEY_PASS }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk spottr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spottr-apk
          path: spottr.apk
      # a numbered release per build, for Obtainium to pick up as an update
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Relay 1.0.${{ github.run_number }}
          body: Relay test build ${{ github.run_number }}.
          files: spottr.apk
          make_latest: true
      # the fixed download link, always the newest build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Spottr test build
          body: Latest test build of Spottr. Download spottr.apk on your phone and open it to install.
          files: spottr.apk
          make_latest: false
      # the build log and the Gemini Nano library's class list, readable without GitHub's Actions pages
      - name: Collect build log
        if: always()
        run: |
          touch build.log
          for a in $(find ~/.gradle -name "genai-*.aar" 2>/dev/null); do echo "== $a" >> build.log; mkdir -p /tmp/aar && unzip -o -q "$a" classes.jar -d /tmp/aar && unzip -l /tmp/aar/classes.jar | awk '{print $4}' | grep class$ >> build.log; done
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: build-log
          name: Build log
          body: Log of the latest build.
          files: build.log
          prerelease: true
          make_latest: false
